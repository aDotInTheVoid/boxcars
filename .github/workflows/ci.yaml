name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --all
    - run: RUSTFLAGS='--cfg slow_tests' cargo test --all
    - run: cargo test --all --features flight_recorder
    - run: cargo bench --no-run
    # TODO: Test under systematic_testing.
    # RUSTFLAGS=-Zsanitizer=address cargo +nightly test --features sanitizer_address --tests --lib --all
    # RUSTFLAGS=-Zsanitizer=thread cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --features sanitizer_thread --all --lib --tests
    
