[package]
name = "verona-rt"
version = "0.0.2"
edition = "2021"
description = "Idiomatic binding to the verona runtime"
license.workspace = true
repository.workspace = true

[dependencies]
verona-rt-sys = { version = "=0.0.2", path = "../verona-rt-sys" }
cstr = "0.2.11" # TODO: Remove

[features]
systematic_testing = ["verona-rt-sys/systematic_testing"]
flight_recorder = ["verona-rt-sys/flight_recorder"]
snmalloc_tracing = ["verona-rt-sys/snmalloc_tracing"]

sanitizer_address = ["__any_sanitizer", "verona-rt-sys/sanitizer_address"] 
sanitizer_thread  = ["__any_sanitizer", "verona-rt-sys/sanitizer_thread"]

# Only for cfg's
__any_sanitizer = []

[dev-dependencies]
libc = "0.2.153"
