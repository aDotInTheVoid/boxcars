[package]
name = "boc"
version = "0.0.1"
edition = "2021"
description = "Behaviour-Oriented Concurrency"
license.workspace = true
repository.workspace = true

[dependencies]
boc-sys = { version = "=0.0.1", path = "../boc-sys" }

[features]
systematic_testing = ["boc-sys/systematic_testing"]
flight_recorder = ["boc-sys/flight_recorder"]
snmalloc_tracing = ["boc-sys/snmalloc_tracing"]

sanitizer_address = ["__any_sanitizer", "boc-sys/sanitizer_address"] 
sanitizer_thread  = ["__any_sanitizer", "boc-sys/sanitizer_thread"]

# Only for cfg's
__any_sanitizer = []

[dev-dependencies]
# Fun hack to force clap to be built with help and color, for criterion.
clap = { version = "4.5.4", features = ["std", "help"] }
criterion = "0.5.1"
stdx = { path = "../stdx" }
trybuild = "1.0.96"

[[bench]]
name = "micro"
harness = false
